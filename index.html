<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Magnet, Listrik, dan Teknologi</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe9ff;--card:#ffffff;--ink:#2b2350;--mute:#6a6190;--pur:#7c5cd6;--tos:#2bb5a8;--pink:#ffc2da;--but:#fff3b0;--ok:#1f9d6b;--bad:#d6455d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1838;--card:#2a2350;--ink:#f1edff;--mute:#b9b0e0;--but:#4a4320;--pink:#5a3250}}
:root[data-theme="dark"]{--bg:#1d1838;--card:#2a2350;--ink:#f1edff;--mute:#b9b0e0;--but:#4a4320;--pink:#5a3250}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0 0 8px;line-height:1.2}
h2{font-size:clamp(24px,4vw,34px)}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 6px 20px rgba(124,92,214,.15)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--pur);color:#fff;font:900 17px "Nunito",system-ui,sans-serif;padding:12px 26px;cursor:pointer;box-shadow:0 0 14px rgba(124,92,214,.55);letter-spacing:.5px}
.btn:hover{filter:brightness(1.1)}
.btn.alt{background:var(--tos);box-shadow:0 0 14px rgba(43,181,168,.5)}
.btn.sm{padding:8px 18px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;margin-top:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.mapbox{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 6px 20px rgba(124,92,214,.25);line-height:0}
.mapbox img{width:100%;height:auto;display:block}
.hot{position:absolute;width:10%;height:11%;transform:translate(-50%,-50%);border:3px solid transparent;border-radius:14px;background:transparent;cursor:pointer;padding:0}
.hot:hover,.hot:focus-visible{border-color:#fff;background:rgba(255,255,255,.3);outline:none}
.hot .ck{position:absolute;top:-6px;right:-6px;background:var(--ok);color:#fff;border-radius:50%;width:22px;height:22px;font:900 13px/22px sans-serif;text-align:center}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:16px}
.menu button{border:0;border-radius:24px;padding:26px 16px;font:900 22px "Nunito",system-ui,sans-serif;color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.menu button span{display:block;font-size:44px}
.goal{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.goal b{flex:none;width:44px;height:44px;border-radius:50%;background:var(--pur);color:#fff;display:grid;place-items:center;font-size:22px}
.viz{font-size:clamp(36px,7vw,60px);text-align:center;background:var(--but);border-radius:20px;padding:12px;margin:12px 0}
.terms{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.terms span{background:var(--pink);border-radius:999px;padding:4px 14px;font-weight:800;font-size:16px}
.sum{background:var(--but);border-left:6px solid var(--tos);border-radius:14px;padding:10px 14px;font-weight:800}
.tag{display:inline-block;background:var(--tos);color:#fff;border-radius:999px;padding:2px 14px;font-weight:900;font-size:15px}
.opt{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 18px;border-radius:18px;border:3px solid var(--pur);background:var(--card);color:var(--ink);font:800 18px "Nunito",system-ui,sans-serif;cursor:pointer}
.opt:hover{background:var(--but)}
.fb{border-radius:18px;padding:14px 18px;margin-top:12px;font-weight:700}
.fb.ok{background:#d9f5e8;color:#0f5c3d}.fb.no{background:#ffe0e6;color:#8a1f33}
.video{aspect-ratio:16/9;border-radius:20px;background:linear-gradient(135deg,#b9a7f5,#7fdad2);display:grid;place-items:center;text-align:center;color:#fff;overflow:hidden}
.video iframe{width:100%;height:100%;border:0}
.prog{height:12px;border-radius:99px;background:var(--pink);overflow:hidden;margin-bottom:12px}.prog i{display:block;height:100%;background:var(--pur)}
.cover-bar{text-align:center;margin-top:14px}
.id{display:inline-block;background:var(--card);border-radius:18px;padding:8px 18px;margin-bottom:10px;font-weight:800;font-size:16px}
</style>
</head>

{id:'m2',isl:'Pulau Magnet',t:'Pos 2 · Medan Magnet',x:18.5,y:39.9,viz:'🧭 〰️ 🧲',
 body:['Medan magnet adalah ruang di sekitar magnet tempat gaya magnet masih terasa.','Medan magnet digambarkan dengan garis gaya yang keluar dari kutub utara dan masuk ke kutub selatan. Gaya paling kuat di dekat kutub.','Bumi juga seperti magnet raksasa. Karena itu jarum kompas selalu menunjuk arah utara-selatan.'],

{id:'m3',isl:'Pulau Magnet',t:'Pos 3 · Aplikasi Magnet',x:28,y:42.8,viz:'🔊 🚪 🧭 🚆',

{id:'l1',isl:'Pulau Listrik',t:'Pos 1 · Sumber Listrik',x:43.5,y:55.8,viz:'🔋 ☀️ 💧',

 terms:['baterai','generator','panel surya'],sum:'Listrik berasal dari perubahan energi lain menjadi energi listrik.'},
{id:'l2',isl:'Pulau Listrik',t:'Pos 2 · Rangkaian Listrik',x:52.6,y:58.7,viz:'🔋 — 🔘 — 💡',
 body:['Rangkaian listrik sederhana terdiri atas sumber listrik, kabel, saklar, dan lampu.','Rangkaian tertutup: arus mengalir dan lampu menyala. Rangkaian terbuka: arus terputus dan lampu padam.','Rangkaian seri hanya punya satu jalur, jadi jika satu lampu putus, semua padam. Rangkaian paralel bercabang, jadi lampu lain tetap menyala.'],
 terms:['saklar','rangkaian seri','rangkaian paralel'],sum:'Lampu menyala jika rangkaian tertutup.'},
{id:'l3',isl:'Pulau Listrik',t:'Pos 3 · Penggunaan Listrik',x:61.8,y:61.4,viz:'💡 🌀 ♨️ 📺',
 body:['Energi listrik berubah menjadi bentuk lain: cahaya pada lampu, gerak pada kipas, panas pada setrika, bunyi pada radio.','Hemat listrik: matikan lampu yang tidak dipakai dan cabut alat elektronik yang tidak digunakan.','Aman memakai listrik: jangan menyentuh alat listrik dengan tangan basah, jangan memakai kabel rusak, dan jangan mencolok sembarangan.'],

{id:'t1',isl:'Pulau Teknologi',t:'Pos 1 · Teknologi Komunikasi',x:76.6,y:42,viz:'📱 📻 📡 💻',

{id:'t2',isl:'Pulau Teknologi',t:'Pos 2 · Teknologi Transportasi',x:85.3,y:46.4,viz:'🚲 🚆 🚢 ✈️',

if(v==='video')return $(`<div class="card"><h2>🎬 Video Pembelajaran</h2>${VIDEO_URL?`<div class="video"><iframe src="${VIDEO_URL}" allowfullscreen title="Video pembelajaran"></iframe></div>`:`<div class="video"><div><div style="font-size:72px">▶</div><b>Video belum dipasang</b></div></div><p class="sum" style="margin-top:12px">Tempat video: ganti nilai VIDEO_URL di kode dengan tautan embed video pilihan guru.</p>`}<p>Isi video yang disarankan: percobaan gaya magnet, rangkaian listrik sederhana, dan contoh teknologi sehari-hari.</p><div class="row">${btn('MENU',"go('menu')")}</div></div>`);
if(v==='kuis'){const q=Q[S.q];S.tried=false;return $(`<div class="card"><div class="top"><span class="tag">Soal ${S.q+1} dari ${Q.length}</span>${btn('MENU',"go('menu')",'sm')}</div><div class="prog"><i style="width:${S.q/Q.length*100}%"></i></div>
<h3>${q.q}</h3>${q.o.map((o,i)=>`<button class="opt" onclick="pick(${i})"><b>${L[i]}.</b> ${o}</button>`).join('')}<div id="fb"></div></div>`);}
if(v==='selesai'){const c=S.first.filter(Boolean).length;return $(`<div class="card" style="text-align:center"><div style="font-size:72px">🏆🎉</div><h2>Selamat, kamu hebat!</h2><p>Kamu sudah menyelesaikan petualangan di tiga pulau ilmu.</p>
<p class="sum">Benar pada percobaan pertama: ${c} dari ${Q.length} soal</p><p>Magnet, listrik, dan teknologi ada di sekitar kita. Teruslah bertanya dan mencoba!</p>
<div class="row">${btn('↻ ULANGI',"S.seen=new Set();S.q=0;S.first=[];go('menu')",'alt')}${btn('MENU UTAMA',"go('menu')")}</div></div>`);}}
function pick(i){const q=Q[S.q],f=document.getElementById('fb');
if(i===q.a){if(S.first[S.q]===undefined)S.first[S.q]=!S.tried;
document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
f.innerHTML=`<div class="fb ok">✅ Benar! Hebat! ${q.why}</div><div class="row">${S.q<Q.length-1?btn('LANJUT →',"S.q++;go('kuis')"):btn('SELESAI →',"go('selesai')")}</div>`;}
else{S.tried=true;if(S.first[S.q]===undefined)S.first[S.q]=false;
f.innerHTML=`<div class="fb no">❌ Belum tepat. ${q.hint}</div><div class="row">${btn('COBA LAGI',"go('kuis')")}${btn('PELAJARI MATERI',`go('pos',${POS.findIndex(p=>p.id===q.pos)})`,'alt')}</div>`;}}
draw();
</script>
</body>
</html>
